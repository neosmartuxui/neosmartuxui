          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dist/studio/studio-data.json','utf8'));if(!d.builtInThemes?.pulse||d.builtInThemes.pulse.light!=='packages/themes/pulse-light'||d.builtInThemes.pulse.dark!=='packages/themes/pulse-dark')throw new Error('Pulse official starter pair missing')"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/studio/studio-build.json','utf8')); if(d.sourceSha!==process.env.NEOSMARTUI_SOURCE_SHA || d.publicDeployment!==true || d.publicRoute!=='/studio/') throw new Error('Studio build provenance mismatch')"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/studio/deployment.json','utf8')); if(d.schema!=='neosmartui/deployment-record@1' || d.sourceRepository!=='neosmartui/neosmartui' || d.sourceSha!==process.env.NEOSMARTUI_SOURCE_SHA || d.artifact!=='studio') throw new Error('Studio deployment record mismatch')"

  browser:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOSMARTUI_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright test runtime
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact-SHA Foundry artifact
        run: npm run build:foundry
      - name: Run Foundry browser QA
        run: npm run test:browser
      - name: Build Studio artifact
        run: npm run build:studio
      - name: Run Studio browser QA
        run: npm run test:studio
      - name: Upload browser and deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-browser-evidence-${{ env.NEOSMARTUI_SOURCE_SHA }}
          path: |
            artifacts/browser
            artifacts/studio
            dist/foundry
            dist/studio
          if-no-files-found: error
          retention-days: 14
